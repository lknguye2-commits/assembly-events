  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"aa9c255a-e147-436a-afc4-955ce014b778\"><\u002Fscript>\n<script src=\"f5837800-4220-4978-9b40-eb4ff0535c71\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; text-wrap: pretty; background: var(--color-neutral-100); }\n  a { color: var(--color-neutral-700); text-decoration: none; }\n  a:hover { color: var(--color-neutral-800); }\n  summary::-webkit-details-marker { display: none; }\n  summary { list-style: none; }\n  details[open] .plus { transform: rotate(45deg); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: var(--font-body); color: var(--color-text); background: var(--color-neutral-100); min-height: 100vh\">\n\n  <nav class=\"nav\" style=\"padding-inline: max(clamp(20px,5vw,72px), calc((100% - 1200px) / 2 + clamp(20px,5vw,72px)))\">\n    <span class=\"nav-brand\" style=\"letter-spacing: -0.02em\">Assembly<\u002Fspan>\n    <a href=\"#services\" style=\"white-space: nowrap\">Services<\u002Fa>\n    <a href=\"#about\" style=\"white-space: nowrap\">About<\u002Fa>\n    <a href=\"#process\" style=\"white-space: nowrap\">Process<\u002Fa>\n    <a href=\"#faq\" style=\"white-space: nowrap\">FAQ<\u002Fa>\n    <a href=\"#consult\" class=\"btn btn-primary\" style=\"text-decoration: none; white-space: nowrap; background: var(--color-neutral-800); border-color: var(--color-neutral-800); color: var(--color-neutral-100)\">Book a consult<\u002Fa>\n  <\u002Fnav>\n\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px,5vw,72px)\">\n\n    <section style=\"padding: clamp(72px,10vw,148px) 0 96px\">\n      <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700); font-feature-settings: 'tnum' 1\">Corporate event planning &nbsp;·&nbsp; Southern California<\u002Fp>\n      <h1 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(42px,6.2vw,84px); line-height: 1.14; letter-spacing: -0.02em; margin: 0 0 0 -0.058em\">\n        <span style=\"display: block\">Gatherings with<\u002Fspan>\n        <span style=\"display: block\">California in them.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 30px; max-width: 58ch; margin: 34px 0 0\">Assembly plans and produces corporate events across Los Angeles, Orange County and San Diego — conferences, launches, retreats and the long dinners where things get decided. Open air, good light, unhurried hospitality, and a plan underneath it all.<\u002Fp>\n      <div style=\"display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: 32px\">\n        <a href=\"#consult\" class=\"btn btn-primary\" style=\"text-decoration: none; white-space: nowrap; background: var(--color-neutral-800); border-color: var(--color-neutral-800); color: var(--color-neutral-100)\">Book a consult<\u002Fa>\n        <a href=\"#services\" class=\"btn btn-ghost\" style=\"text-decoration: none; white-space: nowrap; color: var(--color-neutral-800); border-color: var(--color-neutral-800)\">See what we do<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <figure class=\"grayscale\" style=\"margin: 0 0 8px\">\n      <image-slot id=\"hero-photo\" shape=\"rect\" style=\"width: 100%; aspect-ratio: 16 / 10\" placeholder=\"Drop a hero photograph — a seated dinner, a stage, a full room\" src=\"76ad372b-ee61-4b4c-969c-e7e1add07aed\"><\u002Fimage-slot>\n    <\u002Ffigure>\n\n    <section style=\"padding: 76px 0 64px\" aria-label=\"Assembly in brief\">\n      <div style=\"display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 40px 28px\">\n        <div>\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(34px,3.4vw,48px); line-height: 56px; color: var(--color-neutral-800); margin: 0 0 0 -0.045em\">10 yrs<\u002Fp>\n          <p style=\"font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent); margin: 14px 0 0\">Planning events<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(34px,3.4vw,48px); line-height: 56px; color: var(--color-neutral-800); margin: 0 0 0 -0.045em\">3<\u002Fp>\n          <p style=\"font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent); margin: 14px 0 0\">Counties served<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(34px,3.4vw,48px); line-height: 56px; color: var(--color-neutral-800); margin: 0 0 0 -0.045em\">12—1,200<\u002Fp>\n          <p style=\"font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent); margin: 14px 0 0\">Guest counts handled<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(34px,3.4vw,48px); line-height: 56px; color: var(--color-neutral-800); margin: 0 0 0 -0.045em\">1<\u002Fp>\n          <p style=\"font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent); margin: 14px 0 0\">Point of contact — always<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr class=\"hr\" style=\"margin: 0\">\n\n    <section id=\"services\" style=\"padding: 104px 0 84px\">\n      <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700)\">Services<\u002Fp>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(28px,3.4vw,40px); line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 56px -0.03em; max-width: 24ch\">Full production, or the part you can't cover.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: minmax(0,1fr); gap: 0\">\n        <div style=\"display: grid; grid-template-columns: minmax(64px,140px) minmax(0,380px) minmax(0,1fr); gap: 28px clamp(24px,4vw,72px); align-items: baseline; padding: 52px 0\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; line-height: 30px; margin: 0; font-feature-settings: 'tnum' 1\">01<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 30px; letter-spacing: -0.01em; margin: 0\">Full-service planning<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 0; max-width: 52ch; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">Concept through load-out. Venue sourcing, budget architecture, vendor negotiation, run of show, and someone senior on the floor the whole time.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(64px,140px) minmax(0,380px) minmax(0,1fr); gap: 28px clamp(24px,4vw,72px); align-items: baseline; padding: 52px 0; border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent)\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; line-height: 30px; margin: 0; font-feature-settings: 'tnum' 1\">02<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 30px; letter-spacing: -0.01em; margin: 0\">Design &amp; guest experience<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 0; max-width: 52ch; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">Room design, seating strategy, menu direction, printed matter and the small courtesies guests remember — restraint, not spectacle.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(64px,140px) minmax(0,380px) minmax(0,1fr); gap: 28px clamp(24px,4vw,72px); align-items: baseline; padding: 52px 0; border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent)\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; line-height: 30px; margin: 0; font-feature-settings: 'tnum' 1\">03<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 30px; letter-spacing: -0.01em; margin: 0\">Production &amp; technical<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 0; max-width: 52ch; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">Stage, audio, lighting, screens and speaker support, plus rehearsals that catch the problems before the audience does.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(64px,140px) minmax(0,380px) minmax(0,1fr); gap: 28px clamp(24px,4vw,72px); align-items: baseline; padding: 52px 0; border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent)\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; line-height: 30px; margin: 0; font-feature-settings: 'tnum' 1\">04<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 30px; letter-spacing: -0.01em; margin: 0\">Month-of management<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 0; max-width: 52ch; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">You've booked the venue and the caterer. We take the contracts, timeline and vendors off your desk four weeks out and carry the event.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr class=\"hr\" style=\"margin: 0\">\n\n    <section style=\"padding: 108px 0 96px\">\n      <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700)\">Event types<\u002Fp>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(28px,3.4vw,40px); line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 48px -0.03em; max-width: 26ch\">Every kind of corporate event — indoors or out.<\u002Fh2>\n      <ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent)\">\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Conferences &amp; summits<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Product launches<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Executive retreats<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Board &amp; investor meetings<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Client appreciation dinners<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Galas &amp; fundraisers<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Holiday parties<\u002Fli>\n        <li style=\"display: flex; align-items: baseline; gap: 14px; padding: 20px 0; border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); font-size: 16px; line-height: 30px\"><span style=\"width: 10px; height: 10px; background: var(--color-neutral-800); flex: 0 0 10px\"><\u002Fspan>Team offsites<\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <section id=\"about\" style=\"display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 28px clamp(24px,5vw,96px); align-items: start; padding: 24px 0 104px\">\n      <figure class=\"grayscale\" style=\"margin: 0\">\n        <image-slot id=\"founder-photo\" shape=\"rect\" style=\"width: 100%; aspect-ratio: 4 / 5\" placeholder=\"Drop a portrait of Ly\" src=\"b0c0c104-2bf9-45fa-b771-08c8209e4a53\"><\u002Fimage-slot>\n      <\u002Ffigure>\n      <div>\n        <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700)\">About<\u002Fp>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(28px,3.4vw,40px); line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 28px -0.03em\">Ly Nguyen, Founder<\u002Fh2>\n        <p style=\"font-size: 16.5px; line-height: 30px; margin: 0 0 24px; max-width: 54ch\">For nearly a decade—from college through my career in finance—I planned events alongside my day job: team offsites, client dinners, galas, and even the launch no one thought could come together in six weeks. Event planning was never just a side project. It was the part of the work I looked forward to most.<\u002Fp>\n        <p style=\"font-size: 16.5px; line-height: 30px; margin: 0 0 24px; max-width: 54ch; color: color-mix(in srgb, var(--color-text) 82%, transparent)\">Before founding Assembly, I was a Vice President at Goldman Sachs Private Wealth Management, where I learned to read a room, manage complex details, and deliver at a standard that left little room for error. I also hold an MBA from the University of Southern California.<\u002Fp>\n        <p style=\"font-size: 16.5px; line-height: 30px; margin: 0 0 32px; max-width: 54ch; color: color-mix(in srgb, var(--color-text) 82%, transparent)\">Assembly is the leap—a corporate event planning firm grounded in that same discipline, with hospitality at the heart of everything we do. Your name is on the invitation. My job is to make sure the experience lives up to it.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <span class=\"tag tag-neutral\">Ex-VP, Goldman Sachs PWM<\u002Fspan>\n          <span class=\"tag tag-neutral\">MBA, USC<\u002Fspan>\n          <span class=\"tag tag-neutral\">10 years planning<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr class=\"hr\" style=\"margin: 0\">\n\n    <section id=\"process\" style=\"padding: 108px 0 96px\">\n      <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700)\">Process<\u002Fp>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(28px,3.4vw,40px); line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 52px -0.03em; max-width: 24ch\">Four steps, kept unhurried.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 clamp(24px,4vw,56px)\">\n        <div style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 24px 0 8px\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: var(--color-neutral-800); margin: 0 0 18px; font-feature-settings: 'tnum' 1\">STEP 01<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 21px; line-height: 30px; letter-spacing: -0.01em; margin: 0 0 12px\">Consult<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 30px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">A working call: objective, guest list, date, budget range. You leave with a candid read on what's achievable.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 24px 0 8px\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: var(--color-neutral-800); margin: 0 0 18px; font-feature-settings: 'tnum' 1\">STEP 02<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 21px; line-height: 30px; letter-spacing: -0.01em; margin: 0 0 12px\">Proposal<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 30px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">Scope, venue options, a line-item budget and a schedule — priced before anything is booked.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 24px 0 8px\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: var(--color-neutral-800); margin: 0 0 18px; font-feature-settings: 'tnum' 1\">STEP 03<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 21px; line-height: 30px; letter-spacing: -0.01em; margin: 0 0 12px\">Build<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 30px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">Contracts, design, vendors and run of show, with a standing update so you always know where things stand.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 24px 0 8px\">\n          <p style=\"font-family: var(--font-heading); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: var(--color-neutral-800); margin: 0 0 18px; font-feature-settings: 'tnum' 1\">STEP 04<\u002Fp>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 600; font-size: 21px; line-height: 30px; letter-spacing: -0.01em; margin: 0 0 12px\">Execute<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 30px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent)\">On site from load-in to load-out. Afterwards: reconciled budget and a short debrief for next time.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr class=\"hr\" style=\"margin: 0\">\n\n    <section id=\"faq\" style=\"display: grid; grid-template-columns: minmax(0,4fr) minmax(0,8fr); gap: 28px clamp(24px,5vw,96px); align-items: start; padding: 108px 0 96px\">\n      <div>\n        <p style=\"margin: 0 0 28px; font-size: 13px; line-height: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700)\">FAQ<\u002Fp>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(28px,3.4vw,40px); line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 -0.03em\">Questions, answered plainly.<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <details style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 20px 0\">\n          <summary style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 30px\">What does Assembly cost?<span class=\"plus\" style=\"flex: 0 0 auto; color: var(--color-neutral-800); font-size: 22px; line-height: 1; transition: transform .18s ease\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 16px 0 4px; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 80%, transparent)\">Most engagements are a flat management fee scaled to scope, quoted in the proposal. Larger productions can run on a percentage of spend. Either way you see the full budget before you commit to anything.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 20px 0\">\n          <summary style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 30px\">How far ahead should we book?<span class=\"plus\" style=\"flex: 0 0 auto; color: var(--color-neutral-800); font-size: 22px; line-height: 1; transition: transform .18s ease\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 16px 0 4px; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 80%, transparent)\">Three to six months is comfortable for a multi-day conference or a holiday party; six to eight weeks is workable for a dinner or an offsite. Short timelines are possible — say so early and we'll tell you honestly what it costs in options.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 20px 0\">\n          <summary style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 30px\">Do you travel outside Southern California?<span class=\"plus\" style=\"flex: 0 0 auto; color: var(--color-neutral-800); font-size: 22px; line-height: 1; transition: transform .18s ease\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 16px 0 4px; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 80%, transparent)\">Home ground is Los Angeles, Orange County and San Diego. Destination programs elsewhere are welcome, billed with travel at cost.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 20px 0\">\n          <summary style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 30px\">Can you work with vendors we already use?<span class=\"plus\" style=\"flex: 0 0 auto; color: var(--color-neutral-800); font-size: 22px; line-height: 1; transition: transform .18s ease\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 16px 0 4px; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 80%, transparent)\">Of course. Keep the caterer you love and the AV team that knows your building; we'll manage them to the same standard as our own partners.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); border-bottom: 2px solid color-mix(in srgb, var(--color-neutral-900) 38%, transparent); padding: 20px 0\">\n          <summary style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 30px\">Is there a minimum event size?<span class=\"plus\" style=\"flex: 0 0 auto; color: var(--color-neutral-800); font-size: 22px; line-height: 1; transition: transform .18s ease\">+<\u002Fspan><\u002Fsummary>\n          <p style=\"font-size: 15.5px; line-height: 30px; margin: 16px 0 4px; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 80%, transparent)\">No. A twelve-person board dinner gets the same attention as a thousand-person summit — often it matters more.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <section id=\"consult\" style=\"background: var(--color-neutral-800); color: var(--color-neutral-100)\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 112px clamp(20px,5vw,72px)\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(34px,4.2vw,56px); line-height: 1.14; letter-spacing: -0.015em; margin: 0 0 0 -0.058em\">\n        <span style=\"display: block\">Tell me about the event.<\u002Fspan>\n      <\u002Fh2>\n      <p style=\"font-size: 17px; line-height: 30px; max-width: 52ch; margin: 28px 0 44px\">A short note is enough to start. I reply to every inquiry personally, usually within one business day.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px clamp(24px,3vw,48px); max-width: 900px\">\n        <div class=\"field\">\n          <label for=\"f-name\" style=\"color: var(--color-neutral-100)\">Name<\u002Flabel>\n          <input class=\"input\" id=\"f-name\" name=\"name\" type=\"text\" required=\"required\" placeholder=\"Your name\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"f-company\" style=\"color: var(--color-neutral-100)\">Company<\u002Flabel>\n          <input class=\"input\" id=\"f-company\" name=\"company\" type=\"text\" placeholder=\"Where you work\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"f-email\" style=\"color: var(--color-neutral-100)\">Email<\u002Flabel>\n          <input class=\"input\" id=\"f-email\" name=\"email\" type=\"email\" required=\"required\" placeholder=\"you@company.com\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"f-type\" style=\"color: var(--color-neutral-100)\">Event type<\u002Flabel>\n          <input class=\"input\" id=\"f-type\" name=\"type\" type=\"text\" placeholder=\"Conference, dinner, retreat…\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"f-date\" style=\"color: var(--color-neutral-100)\">Approximate date<\u002Flabel>\n          <input class=\"input\" id=\"f-date\" name=\"date\" type=\"text\" placeholder=\"March 2027, or flexible\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"f-guests\" style=\"color: var(--color-neutral-100)\">Guest count<\u002Flabel>\n          <input class=\"input\" id=\"f-guests\" name=\"guests\" type=\"text\" placeholder=\"Roughly how many\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">\n        <\u002Fdiv>\n        <div class=\"field\" style=\"grid-column: 1 / -1\">\n          <label for=\"f-note\" style=\"color: var(--color-neutral-100)\">What are you planning?<\u002Flabel>\n          <textarea class=\"input\" id=\"f-note\" name=\"note\" rows=\"4\" placeholder=\"Objective, city, anything already booked.\" style=\"background: transparent; color: var(--color-neutral-100); border-color: var(--color-neutral-100); resize: vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap\">\n          <button type=\"submit\" class=\"btn btn-ghost\" style=\"white-space: nowrap; color: var(--color-neutral-100); border-color: var(--color-neutral-100)\">Book a consult<\u002Fbutton>\n          <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 0; font-size: 15px; line-height: 30px\">Thank you — your note is with me. I'll reply within one business day.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px,5vw,72px)\">\n    <footer style=\"display: flex; flex-wrap: wrap; gap: 20px 48px; justify-content: space-between; align-items: baseline; padding: 56px 0\">\n      <span style=\"font-family: var(--font-heading); font-weight: 600; font-size: 20px; letter-spacing: -0.02em\">Assembly<\u002Fspan>\n      <span style=\"font-size: 14px; line-height: 30px; color: color-mix(in srgb, var(--color-text) 70%, transparent)\">Corporate event planning · Los Angeles, Orange County &amp; San Diego<\u002Fspan>\n      <a href=\"mailto:hello@assembly.co\" style=\"font-size: 14px; line-height: 30px\">hello@assembly.co<\u002Fa>\n    <\u002Ffooter>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { sent: false };\n  renderVals() {\n    return {\n      sent: this.state.sent,\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
